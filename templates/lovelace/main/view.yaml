# Главная страница дашборда. Правьте вид здесь — генератор трогает маркеры.
#
# Маркеры (подставляет генератор):
#   [[PATH]]          — путь view. НЕ ТРОГАТЬ: по префиксу `zm-` деплой отличает
#                       свои views от ваших. Сменить путь = деплой перестанет
#                       узнавать Главную и наплодит дубли.
#   [[TITLE]]         — заголовок объекта (флаг --title)
#   [[FLOOR_BLOCKS]]  — блок на каждый этаж (_blocks/main_floor_block.yaml)
#   [[SERVICE_BLOCKS]] — блок на сервисную страницу (_blocks/main_service_block.yaml)
#
# Главная обязана быть ПЕРВЫМ view дашборда: на первый view открывается
# дашборд, и на него же ведёт кнопка «назад» с этажных view. Порядок держит
# ha_views.INSERT_AT = 0 — не меняйте его, не поменяв кнопку «назад».
#
# Чего здесь намеренно НЕТ (решение владельца 2026-07-16):
#   • кастомный фон — убран;
#   • карточка «Выбор режима работы колледжа» — убрана;
#   • виджеты шапки (режим, календари) — убраны.
# Нужно вернуть — дописывайте сюда: генератор трогает только маркеры.
title: Главная
path: [[PATH]]
icon: mdi:home
type: sections
max_columns: 3
# Раскладка бейджей (решение владельца 2026-07-28): по центру, снизу,
# с прокруткой вместо переноса.
#   layout: center         — заголовок и бейджи центрируются
#   badges_position: bottom — бейджи под заголовком
#   badges_wrap: scroll     — не переносятся на вторую строку, а прокручиваются
header:
  layout: center
  badges_position: bottom
  badges_wrap: scroll
  card:
    type: markdown
    text_only: true
    content: "# [[TITLE]]"
# Свет всего объекта. Бейдж, а не карточка (решение владельца): компактно, и
# ползунок яркости здесь всё равно был бы обманчив — у вложенной группы она
# считается как среднее от средних по этажам. Вкл/выкл при этом точен.
#
# ⚠ badges_position и badges_wrap выше стояли ВХОЛОСТУЮ: настройки раскладки
# были, а самого списка badges не было.
badges:
  - type: entity
    entity: "[[OBJECT_LIGHT]]"
    name: Весь объект
    show_name: true
    show_state: true
    show_icon: true
    color: amber
  # Режим здания (Оркестратор): select Авто/Ручной. Клик по бейджу открывает
  # окно с выбором опции — выбор сохраняется через сам бейдж. Существует только
  # при установленном Оркестраторе; без него — «недоступно».
  - type: entity
    entity: "[[MODE_SELECT]]"
    name: Режим здания
    show_name: true
    show_state: true
    show_icon: true
    color: deep-purple
sections:
  # Обе секции — ширина 3 (вся ширина дашборда, max_columns: 3): секция даёт
  # 36 колонок сетки, блоки с grid_options.columns: 9 встают по 4 в ряд.
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading_style: title
        heading: Управление этажами
      # Фильтр групп по типу: выбрал тип — на каждом этаже показывается плитка
      # группы этого типа (conditional в блоке этажа). Заглушка = ничего доп.
      - type: tile
        entity: "[[FLOOR_TYPE_FILTER]]"
        features_position: inline
        features:
          - type: select-options
        grid_options:
          columns: full
      [[FLOOR_BLOCKS]]
  # Секция «Сервис»: та же ширина 3, блоки columns: 9 — по 4 в ряд, как этажи.
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading_style: title
        heading: Сервис
      [[SERVICE_BLOCKS]]

# Объединённый виджет датчика: движение + освещённость одного адреса.
# Используется в recreation (и как одна «плитка» на два значения).
#
# ⚠ Почему glance, а не tile: карта tile показывает РОВНО одну сущность —
# движение и освещённость это два разных sensor.*, в один tile их не свести.
# glance с двумя entities — ближайшая нативная «одна плитка на два значения».
# show_name можно включить, если владельцу нужны подписи под иконками.
#
# Плейсхолдеры:
#   [[SENSOR_MS]] — sensor.ms_<addr> (движение)
#   [[SENSOR_IL]] — sensor.il_<addr> (освещённость, люксы)
- type: glance
  columns: 2
  show_name: false
  state_color: true
  entities:
    - entity: "[[SENSOR_MS]]"
    - entity: "[[SENSOR_IL]]"
